[workspace]
members = ["crates/scone_cli_public", "crates/scone_cli_api"]
resolver = "2"

[workspace.package]
license-file = "LICENSE"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
suspicious = "warn"
style = "warn"
complexity = "warn"
perf = "warn"


[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde_json = "1"
log = "0.4.29"
semver = "1"
tempfile = "3"
scone_cli_api = { path = "crates/scone_cli_api" }
