[workspace]
members = [
    "crates/scone_cli_public",
    "crates/scone_cli_api",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde_json = "1"
log = "0.4.29"
semver = "1"
tempfile = "3"
scone_cli_api = { path ="crates/scone_cli_api"}

